apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/thinking-always/k8s-manifests:f7ea986d0ebeadb4912a68ed6c4ccbae9f55a942
        ports:
        - containerPort: 80