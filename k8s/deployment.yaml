apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/thinking-always/k8s-manifests:97e6add0c3893b14983b4d79745855bf55c3fb77
        ports:
        - containerPort: 80