apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/thinking-always/k8s-manifests:0f2ece19f550843d6451621bfc7604eb0ea00a4d
        ports:
        - containerPort: 80