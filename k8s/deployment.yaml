apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/thinking-always/k8s-manifests:a8ff8cf73f95963182744ed801407e557fce37e4
        ports:
        - containerPort: 80